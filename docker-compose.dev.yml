# Надстройка для разработки. Подключается явно:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Имя файла намеренно НЕ docker-compose.override.yml. Такой файл compose
# подхватывает сам, без флагов, — и `docker compose up -d`, то есть ровно
# та команда, которой запускают в бою, молча получала бы отсюда
# NODE_ENV=development. А от этого значения зависит не только удобство:
# при нём cookie сессии выдаётся без флага Secure и без префикса __Host-,
# то есть перестаёт быть привязанной к HTTPS. Разница между «удобно
# отлаживать» и «cookie уезжает по открытому каналу» не должна зависеть от
# того, помнит ли человек про лишний ключ командной строки.
services:
  app:
    environment:
      NODE_ENV: development
    # Исходники монтируются внутрь, чтобы `node --watch` перезапускал
    # процесс без пересборки образа. node_modules остаются из образа:
    # нативные модули собраны под alpine/musl и хостовые сюда не подходят.
    volumes:
      - ./server/src:/app/src:ro
      # Статика тоже монтируется: правка фронтенда не должна требовать
      # пересборки образа.
      - ./web:/app/web:ro
    command: ["node", "--watch", "src/index.js"]
    read_only: false
    # Прямой доступ к backend мимо Caddy — удобно, когда нужно отделить
    # проблему приложения от проблемы прокси.
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    environment:
      DOMAIN: ${DOMAIN:-localhost}
