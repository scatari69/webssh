<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover — чтобы содержимое уходило под вырез, а отступы
         задавались через env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#11111b" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="login.pageTitle">Вход — webssh</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <h1 class="login-title">webssh</h1>
      <p class="login-subtitle" id="subtitle" data-i18n="login.subtitleSignIn">Вход в терминал</p>

      <p class="notice notice-error hidden" id="error" role="alert"></p>

      <!-- Шаг 1: логин и пароль -->
      <form class="login-form" id="credentials-step" novalidate>
        <div class="field">
          <label for="username" data-i18n="login.username">Логин</label>
          <input
            class="input"
            id="username"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            required
          />
        </div>
        <div class="field">
          <label for="password" data-i18n="login.password">Пароль</label>
          <input
            class="input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn btn-primary" type="submit" id="submit-credentials" data-i18n="login.submit">Войти</button>
      </form>

      <!-- Шаг 2: код из приложения-аутентификатора -->
      <form class="login-step hidden" id="verify-step" novalidate>
        <p class="login-subtitle" style="margin: 0" data-i18n="login.verifyHint">Введите код из приложения-аутентификатора или один из кодов восстановления.</p>
        <div class="field">
          <label for="verify-code" data-i18n="login.code">Код</label>
          <input
            class="input code-input"
            id="verify-code"
            inputmode="numeric"
            autocomplete="one-time-code"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="000000"
            required
          />
        </div>
        <button class="btn btn-primary" type="submit" id="submit-verify" data-i18n="login.verifySubmit">Подтвердить</button>
        <button class="link-button" type="button" id="restart-login" data-i18n="login.restart">Начать заново</button>
      </form>

      <!-- Шаг 3: первая привязка двухфакторки -->
      <form class="login-step hidden" id="enroll-step" novalidate>
        <p class="login-subtitle" style="margin: 0" data-i18n="login.enrollHint">Для этой учётной записи нужна двухфакторная аутентификация.</p>
        <a class="otpauth-link" id="otpauth-link" href="#" rel="noopener" data-i18n="login.enrollOpenApp">Открыть в приложении-аутентификаторе</a>
        <div class="field">
          <label for="enroll-secret" data-i18n="login.enrollManual">Или введите секрет вручную</label>
          <div class="secret-box" id="enroll-secret"></div>
        </div>
        <button class="link-button" type="button" id="copy-secret" data-i18n="login.copySecret">Скопировать секрет</button>
        <div class="field">
          <label for="enroll-code" data-i18n="login.enrollCode">Код из приложения</label>
          <input
            class="input code-input"
            id="enroll-code"
            inputmode="numeric"
            autocomplete="one-time-code"
            spellcheck="false"
            placeholder="000000"
            required
          />
        </div>
        <button class="btn btn-primary" type="submit" id="submit-enroll" data-i18n="login.enrollSubmit">Привязать и войти</button>
      </form>

      <!-- Шаг 4: коды восстановления, показываются один раз -->
      <section class="login-step hidden" id="recovery-step">
        <p class="notice notice-warn" data-i18n="login.recoveryWarn">Сохраните коды восстановления.</p>
        <ul class="recovery-codes" id="recovery-codes"></ul>
        <button class="link-button" type="button" id="copy-recovery" data-i18n="login.copyAll">Скопировать все</button>
        <button class="btn btn-primary" type="button" id="recovery-done" data-i18n="login.recoveryDone">Я сохранил коды, продолжить</button>
      </section>

      <div class="theme-row" id="lang-row" role="group" data-i18n-attr="aria-label:lang.group"></div>
      <div class="theme-row" id="theme-row" role="group" data-i18n-attr="aria-label:theme.group"></div>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
