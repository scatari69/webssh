<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#11111b" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="admin.pageTitle">Администрирование — webssh</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <div>
        <h1 class="admin-title" data-i18n="admin.title">Администрирование</h1>
        <p class="admin-whoami" id="whoami" data-i18n="admin.checking">Проверяем доступ…</p>
      </div>
      <nav class="admin-header-actions">
        <a class="btn btn-small" href="/" data-i18n="admin.toTerminal">К терминалу</a>
        <a class="btn btn-small" href="/account" data-i18n="account.title">Двухфакторная аутентификация</a>
        <button class="btn btn-small" type="button" id="logout" data-i18n="admin.logout">Выйти</button>
      </nav>
    </header>

    <main class="admin-main" id="admin-main" hidden>
      <p class="notice notice-error hidden" id="page-error" role="alert"></p>

      <!-- ================================================ пользователи -->
      <section class="card" aria-labelledby="users-title">
        <div class="card-head">
          <h2 class="card-title" id="users-title" data-i18n="users.title">Пользователи</h2>
          <button class="btn btn-small" type="button" id="users-refresh" data-i18n="admin.refresh">Обновить</button>
        </div>
        <p class="card-hint" data-i18n="users.hint"></p>

        <div id="users-table"></div>

        <h3 class="subtitle" data-i18n="users.createTitle">Создать пользователя</h3>
        <form class="form-grid" id="create-user-form" autocomplete="off">
          <div class="field">
            <label for="new-username" data-i18n="users.colLogin">Логин</label>
            <input
              class="input"
              id="new-username"
              name="username"
              type="text"
              required
              minlength="3"
              maxlength="32"
              pattern="[A-Za-z0-9._\-]{3,32}"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              autocomplete="off"
            />
            <span class="field-hint" data-i18n="users.usernameHint"></span>
          </div>

          <div class="field">
            <label for="new-role" data-i18n="users.colRole">Роль</label>
            <select class="input" id="new-role" name="role">
              <option value="user" data-i18n="users.roleUser">Пользователь</option>
              <option value="admin" data-i18n="users.roleAdmin">Администратор</option>
            </select>
            <span class="field-hint" data-i18n="users.roleHint"></span>
          </div>

          <div class="field">
            <label for="new-password" data-i18n="login.password">Пароль</label>
            <!--
              Поле открытым текстом намеренно: администратор задаёт пароль не
              себе, а другому человеку, и всё равно увидит его на экране сразу
              после создания. Прятать ввод здесь — только повод для опечатки.
            -->
            <input
              class="input"
              id="new-password"
              name="password"
              type="text"
              minlength="12"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              autocomplete="off"
              data-i18n-attr="placeholder:users.passwordPlaceholder"
              disabled
            />
            <label class="checkbox">
              <input type="checkbox" id="new-password-generate" checked />
              <span data-i18n="users.generate">Сгенерировать</span>
            </label>
          </div>

          <div class="field-wide form-actions">
            <button class="btn btn-primary" type="submit" id="create-user-submit" data-i18n="users.create">Создать</button>
          </div>
        </form>
      </section>

      <!-- ==================================================== SSH-хост -->
      <section class="card" aria-labelledby="ssh-title">
        <div class="card-head">
          <h2 class="card-title" id="ssh-title" data-i18n="ssh.title">SSH-хост</h2>
          <button class="btn btn-small" type="button" id="ssh-test" data-i18n="ssh.test">Проверить подключение</button>
          <button class="btn btn-small" type="button" id="ssh-refresh" data-i18n="admin.refresh">Обновить</button>
        </div>

        <p class="notice notice-warn" data-i18n="ssh.warn"></p>
        <p class="notice hidden" id="ssh-test-result" role="status"></p>

        <dl class="status-grid" id="ssh-status"></dl>

        <h3 class="subtitle" data-i18n="ssh.editTitle">Изменить</h3>
        <form class="form-grid" id="ssh-form" autocomplete="off">
          <div class="field">
            <label for="ssh-host" data-i18n="ssh.host">Хост</label>
            <input
              class="input"
              id="ssh-host"
              name="host"
              type="text"
              required
              maxlength="255"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              placeholder="10.0.0.5 или server.example.com"
            />
          </div>

          <div class="field">
            <label for="ssh-port" data-i18n="ssh.port">Порт</label>
            <input
              class="input"
              id="ssh-port"
              name="port"
              type="number"
              required
              min="1"
              max="65535"
              value="22"
              inputmode="numeric"
            />
          </div>

          <div class="field">
            <label for="ssh-username" data-i18n="ssh.sshUser">Пользователь SSH</label>
            <input
              class="input"
              id="ssh-username"
              name="ssh_username"
              type="text"
              required
              maxlength="32"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              autocomplete="off"
            />
          </div>

          <div class="field field-wide key-input">
            <label for="ssh-key-text" data-i18n="ssh.privateKey">Приватный ключ</label>
            <!--
              accept намеренно не указан: у ключей обычно нет расширения
              (id_ed25519), и фильтр по типам сделал бы их невыбираемыми в
              системном диалоге.
            -->
            <input class="file-input" id="ssh-key-file" type="file" />
            <textarea
              class="textarea"
              id="ssh-key-text"
              name="private_key"
              rows="6"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"
            ></textarea>
            <span class="field-hint" data-i18n="ssh.keyHint"></span>
          </div>

          <div class="field">
            <label for="ssh-passphrase" data-i18n="ssh.passphraseLabel">Passphrase ключа</label>
            <input
              class="input"
              id="ssh-passphrase"
              name="passphrase"
              type="password"
              autocomplete="new-password"
              data-i18n-attr="placeholder:ssh.passphrasePlaceholder"
            />
            <label class="checkbox">
              <input type="checkbox" id="ssh-passphrase-clear" />
              <span data-i18n="ssh.clearPassphrase">Убрать сохранённую passphrase</span>
            </label>
          </div>

          <div class="field-wide form-actions">
            <button class="btn btn-primary" type="submit" id="ssh-submit" data-i18n="ssh.save">Сохранить</button>
            <button class="btn btn-small" type="button" id="ssh-reset" data-i18n="ssh.resetForm">Сбросить форму</button>
          </div>
        </form>
      </section>

      <!-- ===================================================== журнал -->
      <section class="card" aria-labelledby="audit-title">
        <div class="card-head">
          <h2 class="card-title" id="audit-title" data-i18n="audit.title">Журнал</h2>
          <span class="card-meta" id="audit-count"></span>
          <button class="btn btn-small" type="button" id="audit-refresh" data-i18n="admin.refresh">Обновить</button>
        </div>
        <p class="card-hint" data-i18n="audit.hint"></p>

        <div id="audit-table"></div>
      </section>
    </main>

    <footer class="admin-footer">
      <span class="admin-footer-label" data-i18n="lang.group">Язык</span>
      <div class="admin-header-actions" id="lang-row"></div>
      <span class="admin-footer-label" data-i18n="theme.group">Тема</span>
      <div class="admin-header-actions" id="theme-row"></div>
    </footer>

    <!--
      Без <form method="dialog">: в форме с единственным полем ввода Enter
      вызывает неявную отправку, а она закрыла бы диалог как отмену — ровно
      наоборот к ожиданиям. Enter обрабатывается явно в ui.js.
    -->
    <dialog class="dialog" id="app-dialog" aria-labelledby="dialog-title">
      <div class="dialog-body">
        <h2 class="dialog-title" id="dialog-title"></h2>
        <p class="dialog-message" id="dialog-message"></p>
        <div id="dialog-slot"></div>
        <p class="notice notice-error hidden" id="dialog-error" role="alert"></p>
      </div>
      <div class="dialog-actions">
        <button class="btn" type="button" id="dialog-cancel" data-i18n="dialog.cancel">Отмена</button>
        <button class="btn btn-primary" type="button" id="dialog-confirm" data-i18n="dialog.confirm">Подтвердить</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="/js/admin/main.js"></script>
  </body>
</html>
