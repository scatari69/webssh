services:
  app:
    build:
      # Корень репозитория: в образ нужен и server/, и web/.
      context: .
      dockerfile: server/Dockerfile
    image: webssh-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_PATH: /data/webssh.sqlite
      SSH_KEYS_DIR: /keys
    volumes:
      - app_data:/data
      - ssh_keys:/keys
    networks:
      - internal
    # Портов наружу нет намеренно: единственная точка входа — Caddy.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Проба описана и в образе, но здесь она на виду у того, кто правит
    # compose, и её параметры можно менять, не пересобирая образ. От неё
    # зависит запуск caddy: тот ждёт condition: service_healthy.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # У приложения своя остановка: оно закрывает терминальные сессии,
    # дожидается закрытия соединений и добивает себя через 10 секунд.
    # Пауза по умолчанию — те же 10 секунд, поэтому docker успевал бы
    # прислать SIGKILL ровно в момент штатного завершения.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Без него всё работает, но на мобильных сетях он заметно
      # устойчивее к смене соединения.
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Директива целиком, а не значение: пустая переменная должна давать
      # пустую строку, иначе `email` без аргумента ломает разбор конфига и
      # Caddy не стартует вовсе. Подробнее — в комментарии в Caddyfile.
      ACME_EMAIL_DIRECTIVE: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      ACME_CA_DIRECTIVE: ${ACME_CA_DIRECTIVE:-}
      APP_UPSTREAM: app:${PORT:-3000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Здесь лежат выпущенные сертификаты и ключ ACME-аккаунта. Том обязан
      # переживать пересоздание контейнера: у Let's Encrypt недельные лимиты
      # на выпуск, и потеря этого тома означает повторный выпуск.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  app_data:
  ssh_keys:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
